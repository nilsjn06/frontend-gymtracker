name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gymtracker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: gymtracker

      - name: Run unit tests
        run: npm run test:unit
        working-directory: gymtracker

      - name: Build
        run: npm run build
        working-directory: gymtracker
